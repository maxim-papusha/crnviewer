<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ELK → CoSE demo (30 nodes)</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #topbar { padding: 8px; background: #f3f3f3; border-bottom: 1px solid #ddd; }
    #cy { width: 100vw; height: calc(100vh - 48px); display: block; }
    button { margin-right: 8px; }
  </style>
  <!-- Local Cytoscape core (bundled in package) -->
  <script src="src/crnviewer/static/cytoscape.js"></script>
  <!-- ELK (layout engine) and CoSE layout from CDN -->
  <script src="https://unpkg.com/elkjs/lib/elk.bundled.js"></script>
  <script src="https://unpkg.com/cytoscape-cose-bilk@2.3.0/cytoscape-cose-bilk.js"></script>
</head>
<body>
  <div id="topbar">
    <button id="btn-run-elk">Run ELK (initial)</button>
    <button id="btn-run-cose" disabled>Refine with CoSE</button>
    <button id="btn-stop-cose" disabled>Stop CoSE</button>
    <span id="status">Idle</span>
  </div>

  <div id="cy"></div>

  <script>
    // Register CoSE extension if available
    if (typeof cytoscape !== 'undefined' && typeof window.cytoscapeCoseBilk !== 'undefined') {
      try { cytoscape.use(window.cytoscapeCoseBilk); } catch (e) { /* ignore */ }
    }

    // Create 30 nodes and some edges
    const N = 30;
    const nodes = Array.from({length: N}, (_, i) => ({ data: { id: 'n' + (i+1), label: String(i+1) } }));
    const edges = [];
    // chain edges to make a connected graph
    for (let i = 1; i < N; i++) edges.push({ data: { id: 'e' + i, source: 'n' + i, target: 'n' + (i+1) } });
    // add some random cross links
    for (let i = 0; i < 20; i++) {
      const a = Math.floor(Math.random()*N)+1;
      const b = Math.floor(Math.random()*N)+1;
      if (a !== b) edges.push({ data: { id: 'r' + i, source: 'n' + a, target: 'n' + b } });
    }

    const elements = { nodes: nodes, edges: edges };

    const style = [
      { selector: 'node', style: { 'background-color': '#61bffc', 'label': 'data(label)', 'text-valign': 'center', 'text-halign': 'center', 'width': 24, 'height': 24, 'font-size': 10 } },
      { selector: 'edge', style: { 'width': 1, 'line-color': '#999', 'target-arrow-shape': 'triangle', 'target-arrow-color': '#999', 'curve-style': 'bezier' } }
    ];

    // create Cytoscape instance (empty positions for now)
    const cy = cytoscape({ container: document.getElementById('cy'), elements: elements, style: style, layout: { name: 'grid' } });

    const status = document.getElementById('status');
    const btnElk = document.getElementById('btn-run-elk');
    const btnCose = document.getElementById('btn-run-cose');
    const btnStop = document.getElementById('btn-stop-cose');

    let coseLayout = null;

    async function runElkOnce() {
      status.textContent = 'Running ELK...';
      btnElk.disabled = true;
      // Build ELK graph
      const elk = new ELK();
      const elkGraph = {
        id: 'root', children: nodes.map(n => ({ id: n.data.id, width: 40, height: 40 })),
        edges: edges.map((e, i) => ({ id: 'edge' + i, sources: [e.data.source], targets: [e.data.target] }))
      };

      try {
        const lay = await elk.layout({ ...elkGraph }, { 'elk.algorithm': 'layered' });
        // set cytoscape positions from ELK coords (use center)
        if (lay && lay.children) {
          lay.children.forEach(ch => {
            const id = ch.id;
            const cx = (ch.x ?? 0) + (ch.width ?? 0) / 2;
            const cyPos = (ch.y ?? 0) + (ch.height ?? 0) / 2;
            const node = cy.getElementById(id);
            if (node && node.length) {
              node.position({ x: cx, y: cyPos });
            }
          });
        }
        cy.fit(40);
        status.textContent = 'ELK done';
        btnCose.disabled = false;
      } catch (err) {
        console.error('ELK error', err);
        status.textContent = 'ELK failed: ' + err;
        btnElk.disabled = false;
      }
    }

    function runCose() {
      status.textContent = 'Running CoSE (refine)...';
      btnCose.disabled = true;
      // create layout instance, start from current positions
      coseLayout = cy.layout({
        name: 'cose',
        randomize: false,
        animate: true,
        fit: false,
        idealEdgeLength: 50,
        nodeRepulsion: 8000,
        gravity: 0.25
      });
      coseLayout.run();
      btnStop.disabled = false;
      coseLayout.on ? coseLayout.on('layoutstop', () => { status.textContent = 'CoSE stopped'; btnStop.disabled = true; btnCose.disabled = false; }) : null;
    }

    function stopCose() {
      if (coseLayout && typeof coseLayout.stop === 'function') {
        coseLayout.stop();
        status.textContent = 'CoSE stopped';
        btnStop.disabled = true;
        btnCose.disabled = false;
      }
    }

    btnElk.addEventListener('click', runElkOnce);
    btnCose.addEventListener('click', runCose);
    btnStop.addEventListener('click', stopCose);

    // Run ELK automatically on load
    runElkOnce();

  </script>
</body>
</html>
